# Dapr Bindings Component Configuration for Cron Scheduling
# Used for precise time-based reminders via Dapr Jobs API

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: reminder-cron
  namespace: default
spec:
  type: bindings.cron
  version: v1
  metadata:
  # Cron Schedule - Check for due reminders every minute
  - name: schedule
    value: "@every 1m"

  # Direction - Input binding (triggers callback)
  - name: direction
    value: "input"

---
# Usage Pattern for Notification Service

# The Notification Service subscribes to this cron binding to check for due reminders.
# Every minute, Dapr triggers the callback endpoint with the current time.

