---
# Cron Expression Examples

# Daily at 9 AM:           0 9 * * *
# Weekdays at 9 AM:        0 9 * * 1-5
# Every hour:              0 * * * *
# Every 15 minutes:        */15 * * * *
# First day of month:      0 0 1 * *
# Last day of month:       0 0 L * *
# Every Monday at 2 PM:    0 14 * * 1

---
# Performance Considerations

# 1. Polling Interval: 1 minute is a good balance between accuracy and load
# 2. Batch Processing: Process multiple due reminders in a single callback
# 3. Idempotency: Always check Redis state store before sending notifications
# 4. Time Window: Consider reminders due within next 2 minutes (buffer for processing)
# 5. Timezone Handling: Store all times in UTC, convert at delivery

---
# Monitoring and Alerting

# Track these metrics:
# - Reminder processing latency (target: <10 seconds)
# - Missed reminders (target: 0)
# - Duplicate notifications (target: 0)
# - Cron callback failures (alert if >5 in 5 minutes)
