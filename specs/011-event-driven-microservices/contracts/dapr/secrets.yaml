# Dapr Secrets Component Configuration for Kubernetes Secrets
# Used for secure storage of sensitive configuration (API keys, passwords, tokens)

apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: default
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
  # No additional configuration needed for Kubernetes secrets
  # Dapr automatically uses the service account's permissions

---
# Kubernetes Secrets for Phase V

# 1. Kafka/Redpanda Credentials
apiVersion: v1
kind: Secret
metadata:
  name: kafka-secrets
  namespace: default
type: Opaque
stringData:
  saslPassword: "REDPANDA_CLOUD_PASSWORD"  # Replace with actual password

---
# 2. Redis Credentials
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: default
type: Opaque
stringData:
  password: "REDIS_PASSWORD"  # Replace with actual password

---
# 3. Database Credentials (Neon PostgreSQL)
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: default
type: Opaque
stringData:
  connectionString: "postgresql://user:password@neon-host/dbname?sslmode=require"

---
# 4. Better Auth JWT Secret
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: default
type: Opaque
stringData:
  jwtSecret: "YOUR_JWT_SECRET_KEY_HERE"  # Replace with actual secret

---
# 5. Email Service Credentials (SendGrid/AWS SES)
apiVersion: v1
kind: Secret
metadata:
  name: email-secrets
  namespace: default
type: Opaque
stringData:
  apiKey: "SENDGRID_API_KEY"  # Replace with actual API key
  fromEmail: "noreply@yourdomain.com"

---
# 6. TLS Certificates for Kafka
apiVersion: v1
kind: Secret
metadata:
  name: kafka-tls-secrets
  namespace: default
type: Opaque
data:
  ca.crt: |
    LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...  # Base64 encoded CA certificate

---
# Usage in Application Code

# Python Example (Dapr SDK):
#
# from dapr.clients import DaprClient
#
# async def get_secret(secret_store: str, key: str) -> str:
#     """Retrieve secret from Dapr secret store"""
#     async with DaprClient() as client:
#         secret = await client.get_secret(
#             store_name=secret_store,
#             key=key
#         )
#         return secret.secret[key]
#
# # Get Kafka password
# kafka_password = await get_secret("kubernetes-secrets", "kafka-secrets/saslPassword")
#
# # Get database connection string
# db_url = await get_secret("kubernetes-secrets", "database-secrets/connectionString")
#
# # Get JWT secret
# jwt_secret = await get_secret("kubernetes-secrets", "auth-secrets/jwtSecret")

---
# Environment Variables (Alternative to Secrets API)

# For local development, use environment variables:
# - KAFKA_SASL_PASSWORD
# - REDIS_PASSWORD
# - DATABASE_URL
# - JWT_SECRET
# - SENDGRID_API_KEY

# In production, always use Dapr Secrets API with Kubernetes secrets

---
# Secret Rotation Strategy

# 1. Create new secret version
# 2. Update Kubernetes secret
# 3. Restart pods to pick up new secret (rolling restart)
# 4. Verify all services using new secret
# 5. Revoke old secret

# Example rotation script:
#
# kubectl create secret generic kafka-secrets \
#   --from-literal=saslPassword="NEW_PASSWORD" \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# kubectl rollout restart deployment backend-api
# kubectl rollout restart deployment websocket-sync-service
# kubectl rollout restart deployment notification-service

---
# Security Best Practices

# 1. Never commit secrets to version control
# 2. Use separate secrets for dev/staging/production
# 3. Rotate secrets regularly (every 90 days)
# 4. Use RBAC to restrict secret access
# 5. Enable audit logging for secret access
# 6. Use external secret managers (AWS Secrets Manager, Azure Key Vault) for production

