apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
type: Opaque
stringData:
  # Database credentials (Neon PostgreSQL)
  database-url: "postgresql://user:password@neon-host.neon.tech:5432/todo_db?sslmode=require"

  # Redis credentials (managed Redis)
  redis-url: "redis://:password@redis-host:6379/0"

  # Kafka/Redpanda Cloud credentials
  kafka-brokers: "redpanda-host:9092"
  kafka-username: "your-kafka-username"
  kafka-password: "your-kafka-password"

  # Better Auth secret
  better-auth-secret: "your-better-auth-secret-key-here"

  # OpenAI API key
  openai-api-key: "sk-your-openai-api-key-here"

  # SendGrid API key for email notifications
  sendgrid-api-key: "SG.your-sendgrid-api-key-here"

  # Oracle OKE credentials
  oke-kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        certificate-authority-data: YOUR_CA_DATA
        server: https://your-oke-cluster.oci.oraclecloud.com:6443
      name: oke-cluster
    contexts:
    - context:
        cluster: oke-cluster
        user: oke-user
      name: oke-context
    current-context: oke-context
    users:
    - name: oke-user
      user:
        token: YOUR_OKE_TOKEN
