# Staging environment values for dlq-handler
replicaCount: 1

image:
  repository: ghcr.io/your-org/todo-dlq-handler
  pullPolicy: Always
  tag: "staging"

podAnnotations:
  dapr.io/enabled: "true"
  dapr.io/app-id: "dlq-handler"
  dapr.io/app-port: "8004"
  dapr.io/log-level: "debug"
  dapr.io/enable-metrics: "true"
  dapr.io/metrics-port: "9090"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3

env:
  - name: ENVIRONMENT
    value: "staging"
  - name: LOG_LEVEL
    value: "debug"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: database-secret-staging
        key: url
  - name: MAX_RETRY_ATTEMPTS
    value: "3"
