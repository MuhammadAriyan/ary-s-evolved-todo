# Prometheus Configuration
prometheus:
  server:
    enabled: true
    replicaCount: 2

    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi

    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: "oci-bv"

    retention: "30d"

    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - prometheus.todo.example.com
      tls:
        - secretName: prometheus-tls
          hosts:
            - prometheus.todo.example.com

  alertmanager:
    enabled: true
    replicaCount: 2

    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: "oci-bv"

  nodeExporter:
    enabled: true

  pushgateway:
    enabled: false

  kubeStateMetrics:
    enabled: true

# Custom scrape configs
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: 'backend-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
                - staging
                - production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: backend-api
          - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_metrics_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:9090

      - job_name: 'websocket-sync'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
                - staging
                - production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: websocket-sync
          - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_metrics_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:9090

      - job_name: 'notification'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
                - staging
                - production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: notification
          - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_metrics_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:9090

      - job_name: 'dapr-system'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - dapr-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: dapr-.*

# Alert rules
alerting_rules.yml:
  groups:
    - name: backend_api_alerts
      interval: 30s
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="backend-api",status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="backend-api"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            service: backend-api
          annotations:
            summary: "High error rate detected in Backend API"
            description: "Backend API error rate is {{ $value | humanizePercentage }}"
