# Staging environment values for search-indexer
replicaCount: 1

image:
  repository: ghcr.io/your-org/todo-search-indexer
  pullPolicy: Always
  tag: "staging"

podAnnotations:
  dapr.io/enabled: "true"
  dapr.io/app-id: "search-indexer"
  dapr.io/app-port: "8002"
  dapr.io/log-level: "debug"
  dapr.io/enable-metrics: "true"
  dapr.io/metrics-port: "9090"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3

env:
  - name: ENVIRONMENT
    value: "staging"
  - name: LOG_LEVEL
    value: "debug"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: database-secret-staging
        key: url
  - name: ELASTICSEARCH_URL
    valueFrom:
      secretKeyRef:
        name: search-secret-staging
        key: elasticsearch-url
