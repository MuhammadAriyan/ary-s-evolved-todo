# Production environment values for search-indexer
replicaCount: 2

image:
  repository: ghcr.io/your-org/todo-search-indexer
  pullPolicy: IfNotPresent
  tag: "latest"

podAnnotations:
  dapr.io/enabled: "true"
  dapr.io/app-id: "search-indexer"
  dapr.io/app-port: "8002"
  dapr.io/log-level: "info"
  dapr.io/enable-metrics: "true"
  dapr.io/metrics-port: "9090"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  - name: ENVIRONMENT
    value: "production"
  - name: LOG_LEVEL
    value: "info"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: database-secret-production
        key: url
  - name: ELASTICSEARCH_URL
    valueFrom:
      secretKeyRef:
        name: search-secret-production
        key: elasticsearch-url
  - name: SENTRY_DSN
    valueFrom:
      secretKeyRef:
        name: monitoring-secrets
        key: sentry-dsn
