name: Deploy to Staging

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/todo
  CLUSTER_NAME: oke-staging
  NAMESPACE: staging

jobs:
  deploy:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.todo.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Configure kubectl for Oracle OKE
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.OKE_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          kubectl config use-context oke-staging

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy secrets
        run: |
          kubectl create secret generic backend-secrets \
            --from-literal=database-url="${{ secrets.DATABASE_URL }}" \
            --from-literal=redis-url="${{ secrets.REDIS_URL }}" \
            --from-literal=kafka-brokers="${{ secrets.KAFKA_BROKERS }}" \
            --from-literal=kafka-username="${{ secrets.KAFKA_USERNAME }}" \
            --from-literal=kafka-password="${{ secrets.KAFKA_PASSWORD }}" \
            --from-literal=better-auth-secret="${{ secrets.BETTER_AUTH_SECRET }}" \
            --from-literal=openai-api-key="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=sendgrid-api-key="${{ secrets.SENDGRID_API_KEY }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Backend API
        run: |
          helm upgrade --install backend-api ./infrastructure/helm/backend \
            --namespace=${{ env.NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend-api \
            --set ingress.hosts[0].host=api-staging.todo.example.com \
            --set replicaCount=2 \
            --wait --timeout=10m

      - name: Deploy Frontend
        run: |
          helm upgrade --install frontend ./infrastructure/helm/frontend \
            --namespace=${{ env.NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend \
            --set ingress.hosts[0].host=staging.todo.example.com \
            --set env[0].value=https://api-staging.todo.example.com \
            --set replicaCount=2 \
            --wait --timeout=10m

      - name: Deploy WebSocket Sync Service
        run: |
          helm upgrade --install websocket-sync ./infrastructure/helm/websocket-sync \
            --namespace=${{ env.NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-websocket-sync \
            --set ingress.hosts[0].host=ws-staging.todo.example.com \
            --set replicaCount=2 \
            --wait --timeout=10m

      - name: Deploy Notification Service
        run: |
          helm upgrade --install notification ./infrastructure/helm/notification \
            --namespace=${{ env.NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-notification \
            --set replicaCount=2 \
            --wait --timeout=10m

      - name: Wait for deployments to be ready
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/backend-api \
            deployment/frontend \
            deployment/websocket-sync \
            deployment/notification \
            --namespace=${{ env.NAMESPACE }}

      - name: Run health checks
        run: |
          # Wait for services to be fully ready
          sleep 30

          # Check Backend API health
          BACKEND_URL="https://api-staging.todo.example.com/health"
          echo "Checking Backend API health at $BACKEND_URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL)
          if [ $RESPONSE -ne 200 ]; then
            echo "Backend API health check failed with status $RESPONSE"
            exit 1
          fi
          echo "Backend API health check passed"

          # Check Frontend health
          FRONTEND_URL="https://staging.todo.example.com"
          echo "Checking Frontend health at $FRONTEND_URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $FRONTEND_URL)
          if [ $RESPONSE -ne 200 ]; then
            echo "Frontend health check failed with status $RESPONSE"
            exit 1
          fi
          echo "Frontend health check passed"

          # Check WebSocket Sync health
          WS_URL="https://ws-staging.todo.example.com/health"
          echo "Checking WebSocket Sync health at $WS_URL"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $WS_URL)
          if [ $RESPONSE -ne 200 ]; then
            echo "WebSocket Sync health check failed with status $RESPONSE"
            exit 1
          fi
          echo "WebSocket Sync health check passed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          helm rollback backend-api --namespace=${{ env.NAMESPACE }}
          helm rollback frontend --namespace=${{ env.NAMESPACE }}
          helm rollback websocket-sync --namespace=${{ env.NAMESPACE }}
          helm rollback notification --namespace=${{ env.NAMESPACE }}

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
          fi

      - name: Get deployment info
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Service Status ==="
          kubectl get services -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== Ingress Status ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}
